<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梦乡 · 新地图试玩</title><base href="../game/"><style>html,body{margin:0;background:#243d30;color:#fff0cf;font:14px system-ui}header{height:48px;display:flex;gap:8px;align-items:center;padding:0 10px}button{padding:7px 10px;border:0;border-radius:8px;background:#f4e9cf}#stage{height:calc(100dvh - 48px)}#sheet,#speech{display:none}#status{font-size:12px}</style><header><button id="home">屋前</button><button id="river">河畔</button><button id="farm">小田</button><button id="forest">林地</button><button id="wide">全景</button><span id="status">载入地图</span></header><div id="stage"></div><div id="sheet" hidden></div><div id="speech" hidden></div>
<script src="vendor/phaser-3.90.0.min.js"></script><script src="seasons.js"></script><script src="country.js"></script><script src="companions.js"></script><script src="village.js"></script><script src="terrain.js?v8-final2"></script><script src="village-view.js?v8-final2"></script><script>
// Disposable fixture. It never reads or writes player storage.
let p={area:'village',x:480,y:580,moving:false,dx:0,dy:1},path=[],last=performance.now();const s={village:{zoom:1,sound:false},avatar:{kind:'original'},activity:{kind:'walk',title:'在小路上'},world:{hour:12,weather:'晴'},country:{unlocked:12,plots:Array.from({length:12},(_,i)=>({crop:i%3===0?'pumpkin':i%3===1?'herbs':null,waterUntil:Date.now()+600000,workMs:1200000}))},plants:[],creations:[]};
WitchVillage.position=()=>{let distance=(performance.now()-last)*.19;last=performance.now();while(path.length&&distance>0){const q=path[0],d=Math.hypot(q.x-p.x,q.y-p.y);p.dx=q.x-p.x;p.dy=q.y-p.y;if(d<=distance){p.x=q.x;p.y=q.y;path.shift();distance-=d}else{p.x+=p.dx/d*distance;p.y+=p.dy/d*distance;distance=0}}p.moving=path.length>0;return p};
const view=WitchVillageView.mount(document.getElementById('stage'),{getState:()=>s,residents:()=>Object.entries(WitchVillage.NPCS).map(([id,n])=>({...n,id,...WitchVillage.SPOTS[n.home],task:n.intro})),onWalk(q){path=WitchVillage.route(p,q);document.getElementById('status').textContent='沿小路走走'},onError(m){document.getElementById('status').textContent=m},onNow(){},onSpot(){},onReady(){document.getElementById('status').textContent='点地面走动 · 隔离试玩'}});
function jump(x,y,area='village'){p={...p,area,x,y,moving:false};path=[];view.follow()}document.getElementById('home').onclick=()=>jump(480,580);document.getElementById('river').onclick=()=>jump(1215,1000);document.getElementById('farm').onclick=()=>jump(1520,850);document.getElementById('forest').onclick=()=>jump(770,620,'forest');document.getElementById('wide').onclick=()=>view.overview();addEventListener('pagehide',()=>view.destroy(),{once:true});
</script></html>
