<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>生活引擎验证</title><style>body{font:16px system-ui;padding:30px;background:#f5f0df;color:#253d33}li{margin:12px 0}.fail{color:#a12b27}pre{white-space:pre-wrap}</style><h1>那边的小日子 · 生活引擎验证</h1><p id="summary"></p><ol id="results"></ol><script src="../game/games.js"></script><script src="../game/life.js"></script><script src="life-tests.js"></script><script>const rows=globalThis.WitchLifeTestResults;document.querySelector('#summary').textContent=rows.filter(r=>r.pass).length+' / '+rows.length+' 项通过';for(const r of rows){const li=document.createElement('li');li.textContent=(r.pass?'✓ ':'✕ ')+r.name;if(!r.pass){li.className='fail';const pre=document.createElement('pre');pre.textContent=r.error;li.append(pre)}document.querySelector('#results').append(li)}</script></html>
