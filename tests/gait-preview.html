<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梦乡 · 四方向步态预览</title><style>html,body{margin:0;background:#243d30;color:#fff0cf;font:16px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:10px 18px;background:#f5ebd5;border:0;border-radius:8px}#stage{height:calc(100dvh - 90px);min-height:400px}#sheet,#speech{display:none}</style><header><span>实际游戏渲染器 · 放大步态</span><button data-pose="down">向下</button><button data-pose="right">向右</button><button data-pose="up">向上</button><button data-pose="left">向左</button><button id="pause">暂停脚步</button></header><div id="stage"></div><div id="sheet" hidden></div><div id="speech" hidden></div>
<script src="../game/vendor/phaser-3.90.0.min.js"></script><script src="../game/village.js"></script><script src="../game/terrain.js"></script><script src="../game/village-view.js"></script><script>
// Isolated renderer fixture: no storage, resources, NPCs or real player state.
const originalPosition=WitchVillage.position,start=performance.now();let direction='down',moving=true,travel=0,last=performance.now();const s={village:{zoom:2.8,sound:false},avatar:{kind:'original'},activity:{kind:'walk',title:'步态检查'},world:{hour:12,weather:'晴'},country:{plots:[]},plants:[],creations:[]};
WitchVillage.position=()=>{const now=performance.now();if(moving)travel+=(now-last)*.10;last=now;return{area:'inside',x:512+Math.sin(travel/30)*32,y:470+Math.cos(travel/30)*32,moving,dx:direction==='right'?1:direction==='left'?-1:0,dy:direction==='down'?1:direction==='up'?-1:0}};
// The page lives in tests/, so image URLs resolve through a game/ base.
const base=document.createElement('base');base.href='../game/';document.head.append(base);
const view=WitchVillageView.mount(document.getElementById('stage'),{getState:()=>s,residents:()=>[],onWalk(){},onError:console.error,onNow(){},onSpot(){}});
document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>direction=b.dataset.pose);document.getElementById('pause').onclick=e=>{moving=!moving;e.target.textContent=moving?'暂停脚步':'继续走动'};addEventListener('pagehide',()=>view.destroy(),{once:true});
</script></html>
