<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兴趣手册与消除游戏验证</title><style>body{font:15px/1.7 system-ui;background:#faf2dd;color:#354a35;padding:20px}iframe{width:320px;height:690px;border:1px solid #a79d75}li{margin:8px 0}pre{white-space:pre-wrap}.fail{color:#a33}</style><h1>兴趣手册与消除游戏验证</h1><p id="result">测试中…</p><ol id="checks"></ol><div id="fixture"></div><script src="../game/arcade-plus.js?v=0.5.0"></script><script src="../game/board-games.js?v=0.5.0"></script><script src="../game/country.js?v=0.5.0"></script><script src="../game/companions.js?v=0.5.0"></script><script src="../game/arcade.js?v=0.5.0"></script><script src="../game/hobbies.js?v=0.5.0"></script><script src="../game/games.js?v=0.5.0"></script><script src="../game/life.js?v=0.5.0"></script><script>
(async()=>{'use strict';const A=WitchArcade,L=WitchLife,keys=['witchlife-world-v2','witchlife-world-v2-previous','witchlife-world-v2-before-v5'],backups=new Map(),results=[],errors=[];let f;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),assert=(v,t)=>{if(!v)throw Error(t);},doc=()=>f.contentDocument,saved=()=>JSON.parse(localStorage.getItem(keys[0]));
async function until(fn){for(let i=0;i<160;i++){if(fn())return;await wait(50);}throw Error('等待超时');}
function click(t){const b=[...doc().querySelectorAll('#sheet-content button')].find(e=>e.textContent.trim()===t);assert(b,'按钮缺失：'+t);b.click();}
const close=()=>doc().getElementById('close-sheet').click();function hub(){doc().getElementById('together').click();click('玩会儿游戏');}function choice(t){const b=[...doc().querySelectorAll('.game-choice')].find(e=>e.querySelector('strong').textContent===t);assert(b,'缺少游戏 '+t);b.click();}function level(n){doc().querySelector('.level-button[aria-label^="第 '+n+' 关"]').click();}
async function unload(){if(f){const old=f;await new Promise(r=>{old.onload=r;old.src='about:blank';setTimeout(r,1000);});old.remove();f=null;}}
async function launch(s){await unload();if(s&&s.version===5)s.avatar.kind='original';if(s)localStorage.setItem(keys[0],JSON.stringify(s));f=document.createElement('iframe');f.title='320像素宽的隔离游戏';f.src='../game/index.html?arcade='+Date.now();document.getElementById('fixture').append(f);await new Promise(r=>f.onload=r);f.contentWindow.addEventListener('error',e=>errors.push(e.message));f.contentWindow.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));await until(()=>doc().getElementById('loading').hidden);}
async function test(name,fn){await fn();results.push({name,pass:true});const li=document.createElement('li');li.textContent='✓ '+name;document.getElementById('checks').append(li);}
try{assert(location.hostname==='127.0.0.1'&&location.port==='18766','仅限隔离测试源');keys.forEach(k=>backups.set(k,localStorage.getItem(k)));
await test('v3升级保留旧梦种和游戏，新增两本关卡册',async()=>{const s=L.create(Date.now());L.addFragment(s,'测试素材：小院里的花',Date.now());s.version=3;delete s.hobbies;delete s.arcadeProgress;await launch(s);assert(saved().version===5,'没有迁移');assert(saved().fragments.length===1,'旧梦种丢失');hub();assert(doc().querySelectorAll('.game-choice').length===8,'游戏数不对');choice('星月连连看');const mode=doc().querySelector('select[aria-label=难度]');mode.value='legacy';mode.dispatchEvent(new Event('change'));assert(doc().querySelectorAll('.level-button').length===36,'连连看不足36关');});
await test('连连看提示、路线、实际消除与退出续局',async()=>{level(3);const initial=saved().playbox.link;click('伙伴给点提示');const tiles=doc().querySelectorAll('.arcade-tile.hinted');assert(tiles.length===2,'没有提示');assert(doc().querySelector('.link-route'),'没有画出路线');tiles[0].click();tiles[1].click();assert(saved().playbox.link.moves===1,'没有消除');close();hub();choice('星月连连看');click('继续第 3 关 · 旧版轻松');assert(saved().playbox.link.id===initial.id&&saved().playbox.link.moves===1,'未续上');});
await test('连连看完整通关、印章入册、下一关不会被旧局覆盖',async()=>{for(let n=0;n<80&&!A.isLinkDone(saved().playbox.link);n++){const b=saved().playbox.link,h=A.linkHint(b);assert(h,'卡死');doc().querySelectorAll('.arcade-tile')[h.a].click();doc().querySelectorAll('.arcade-tile')[h.b].click();}assert(A.isLinkDone(saved().playbox.link),'未完成');assert(saved().arcadeProgress.link[2]>0,'没记成绩');click('下一关');assert(saved().playbox.link.level===4,'下一关失败');assert(!A.isLinkDone(saved().playbox.link),'新局被旧局覆盖');});
await test('换关明确确认，36关大棋盘在320像素手机宽度内',async()=>{click('关卡册');level(36);assert(saved().playbox.link.level===4,'未确认便覆盖');click('继续原来的关卡');assert(saved().playbox.link.level===4,'不能取消');click('关卡册');level(36);click('开始所选关卡');assert(saved().playbox.link.level===36,'未进入36关');assert(doc().querySelectorAll('.arcade-tile').length===48,'棋盘尺寸错误');const b=doc().querySelector('.arcade-board').getBoundingClientRect();assert(b.left>=0&&b.right<=320,'棋盘横向溢出');assert(doc().querySelectorAll('.stone:disabled').length===2,'石头应该不可点击');close();});
await test('消消乐20关、交换连消、存档与过关反馈',async()=>{const s=saved();s.playbox.match3=A.match3(333,1);await launch(s);hub();choice('小院消消乐');assert(doc().querySelectorAll('.level-button').length===20,'不足20关');click('继续第 1 关 · 经典');let n=0;while(!A.isMatchDone(saved().playbox.match3)&&n++<60){const b=saved().playbox.match3,h=A.matchHint(b);assert(h,'无可行动作');doc().querySelectorAll('.arcade-tile')[h.a].click();doc().querySelectorAll('.arcade-tile')[h.b].click();await wait(290);}assert(saved().arcadeProgress.match3[0]>0,'过关没记分');assert(doc().querySelector('.arcade-outcome').textContent.includes('过关'),'没有过关反馈');click('下一关');const id=saved().playbox.match3.id;close();hub();choice('小院消消乐');click('继续第 2 关 · 经典');assert(saved().playbox.match3.id===id,'消消乐没有续上');close();});
await test('兴趣手册六项计划可设愿望，开工扣材料、玩游戏能接着做',async()=>{doc().getElementById('together').click();click('她的兴趣手册');assert(doc().querySelectorAll('.hobby-card').length===6,'兴趣少了');doc().querySelector('.hobby-card').querySelectorAll('button')[1].click();assert(saved().hobbies.focus==='sachet','愿望没保存');const before=saved().home.pantry.herbs;doc().querySelector('.hobby-card button').click();assert(saved().activity.kind==='sachet','没有开始');assert(saved().home.pantry.herbs===before-1,'材料没消耗');const id=saved().activity.id;hub();choice('星月连连看');click('继续第 36 关 · 旧版轻松');close();assert(saved().activity.id===id,'兴趣没有接回');});
await test('成品真正留在小屋与手册，来历包含已完成步骤',async()=>{const s=L.create(Date.now()-180000);for(let i=0;i<2;i++){L.invite(s,'starlamp',{},s.lastAdvancedAt);L.advance(s,s.activity.endsAt);}L.invite(s,'starlamp',{},s.lastAdvancedAt);s.activity.startedAt=Date.now();s.activity.endsAt=s.activity.startedAt+1800;s.activity.durationMs=1800;s.lastAdvancedAt=s.activity.startedAt;await launch(s);await until(()=>doc().querySelector('[aria-label="查看最新手作与兴趣手册"]'));doc().querySelector('[aria-label="查看最新手作与兴趣手册"]').click();assert(doc().querySelector('.work-album').textContent.includes('窗边纸星灯'),'没有成品');assert(doc().querySelector('.work-album').textContent.includes('完成了 3 个步骤'),'过程丢失');});
await test('新互动无脚本错误，手机面板无横向溢出',async()=>{assert(errors.length===0,errors.join('\n'));assert(doc().documentElement.scrollWidth<=320,'手机页面横向溢出');});
}catch(e){results.push({name:'集成流程',pass:false,error:e.stack});const li=document.createElement('li');li.className='fail';li.textContent='✗ '+e.stack;document.getElementById('checks').append(li);}finally{await unload();backups.forEach((v,k)=>v===null?localStorage.removeItem(k):localStorage.setItem(k,v));document.getElementById('result').textContent=results.filter(r=>r.pass).length+' / '+results.length+' 项通过，测试存档已还原';document.documentElement.dataset.testResult=results.every(r=>r.pass)?'pass':'fail';}})();
</script></html>
