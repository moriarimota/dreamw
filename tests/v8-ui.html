<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>梦乡 v0.8 手机交互回归</title><style>body{font:14px/1.6 system-ui;background:#eee8d8;color:#304938}iframe{border:0;width:402px;height:874px}.fail{color:#a43}</style><h1>四季生活界面检查</h1><p id="result">准备中</p><ol id="checks"></ol><div id="fixture"></div>
<script src="../game/seasons.js"></script><script src="../game/arcade-plus.js"></script><script src="../game/arcade.js"></script><script src="../game/board-games.js"></script><script src="../game/country.js"></script><script src="../game/companions.js"></script><script src="../game/letters.js"></script><script src="../game/hobbies.js"></script><script src="../game/pocket-games.js"></script><script src="../game/festival-games.js"></script><script src="../game/games.js"></script><script src="../game/village.js"></script><script src="../game/kitchen.js"></script><script src="../game/library.js"></script><script src="../game/life.js"></script>
<script>
(async()=>{const keys=['witchlife-world-v2','witchlife-world-v2-previous','witchlife-world-v2-before-v6','witchlife-world-v2-before-v7'],backup=new Map(keys.map(k=>[k,localStorage.getItem(k)])),results=[];let f;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),d=()=>f.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},until=async fn=>{for(let i=0;i<600;i++){if(fn())return;await wait(50)}throw Error('等待超时；'+(f?.contentWindow?.__testErrors||[]).join(';')+'；'+d()?.getElementById('loading')?.textContent)};
function button(text){const b=[...d().querySelectorAll('button')].find(b=>b.textContent.trim()===text&&!b.closest('[hidden]'));assert(b,'缺少按钮 '+text);return b}function click(t){button(t).click()}function close(){d().getElementById('close-sheet').click()}function hub(name){close();d().getElementById('together').click();click('玩会儿游戏');const b=[...d().querySelectorAll('.game-choice')].find(x=>x.querySelector('strong').textContent===name);assert(b,'没有游戏 '+name);b.click()}
function saved(){return JSON.parse(localStorage.getItem(keys[0]));}function fits(){const b=d().querySelector('.play-main .pocket-board,.play-main .puzzle-board'),sheet=d().getElementById('sheet'),h=f.clientHeight;assert(b,'缺少棋盘');const r=b.getBoundingClientRect();assert(r.top>=0&&r.bottom<=h+1,'棋盘出屏 '+JSON.stringify(r));assert(sheet.scrollHeight<=sheet.clientHeight+1,'整页需要滚动 '+sheet.scrollHeight+' / '+sheet.clientHeight);const tools=d().querySelector('.play-tools').getBoundingClientRect();assert(tools.bottom<=h+1,'按键出屏');assert(d().documentElement.scrollWidth<=f.clientWidth,'横向溢出');}
async function test(name,fn){try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.message,title:d()?.getElementById('sheet-title')?.textContent})}const x=results.at(-1),li=document.createElement('li');li.textContent=(x.pass?'PASS ':'FAIL ')+name+(x.error?' '+x.error:'');li.className=x.pass?'':'fail';document.getElementById('checks').append(li);document.getElementById('result').textContent=results.filter(x=>x.pass).length+'/'+results.length+' 完成中';}
try{assert(['18766','18767'].includes(location.port),'仅限隔离测试源');for(const reg of await navigator.serviceWorker.getRegistrations())if(reg.scope===location.origin+'/game/')await reg.unregister();for(const k of await caches.keys())if(k.startsWith('witchlife-offline-'))await caches.delete(k);const s=WitchLife.create(Date.now());s.avatar.kind='original';s.village.location=WitchVillage.SPOTS.farm;s.country.coins=500;s.country.seeds.herbs=20;s.country.rod=2;localStorage.setItem(keys[0],JSON.stringify(s));f=document.createElement('iframe');document.getElementById('fixture').append(f);const html=(await(await fetch('../game/index.html')).text()).replace('<script defer src="app.js', '<script defer src="../tests/v8-capture.js"><\/script><script defer src="app.js');f.srcdoc=html.replace('<head>','<head><base href="'+location.origin+'/game/"><script>window.__testErrors=[];addEventListener("error",e=>{window.__testErrors.push(e.message||e.target.src||"asset error")},true);addEventListener("unhandledrejection",e=>window.__testErrors.push(String(e.reason)));<\/script>');await until(()=>d()?.querySelector('#village-world[data-ready=true]'));
await test('田地可在地图点选，12块地以触摸网格呈现',async()=>{await wait(200);const sc=f.contentWindow.__testGame.scene.scenes[0],cam=sc.cameras.main,canvas=d().querySelector('#village-world canvas'),rect=canvas.getBoundingClientRect(),p=WitchVillage.PLOTS[1],x=(p.x+30-cam.worldView.x)*cam.zoom,y=(p.y+30-cam.worldView.y)*cam.zoom;canvas.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,clientX:rect.left+x,clientY:rect.top+y,pointerId:1,pointerType:'touch'}));canvas.dispatchEvent(new MouseEvent('mouseup',{bubbles:true,clientX:rect.left+x,clientY:rect.top+y,pointerId:1,pointerType:'touch'}));await until(()=>d().querySelector('.touch-farm'));assert(d().querySelectorAll('.touch-plot').length===12,'田地数量');assert(d().querySelector('.touch-plot').getBoundingClientRect().width>=80,'田地太窄');const empty=[...d().querySelectorAll('.touch-plot')].find(p=>p.textContent.includes('空田'));empty.click();assert(saved().country.plots.some(p=>p.crop),'点田没有播种');click('浇水全部');assert(saved().country.plots.some(p=>p.waterUntil>Date.now()),'浇水失败');});
await test('商店批量买种子，图鉴可翻页',async()=>{click('商店');click('×5');const before=saved().country.seeds.herbs;button('购买 5 颗香草 · 20 星砂').click();assert(saved().country.seeds.herbs===before+5,'批量采购失败');click('图鉴');assert(d().querySelectorAll('.atlas-card').length===8,'图鉴分页');click('鱼类图鉴');assert(d().querySelector('.field-guide').textContent.includes('/ 24'),'鱼种不足');close();});
await test('厨房食谱、料理图鉴与30本书可访问',async()=>{d().getElementById('together').click();click('厨房与餐篮');assert(d().querySelectorAll('.recipe-card').length===6,'食谱分页');click('料理图鉴');assert(d().querySelector('.kitchen-panel').textContent.includes('累计做成'),'料理图鉴');close();d().getElementById('together').click();click('去书架挑一本');assert(d().querySelectorAll('.book-cover').length===30,'书目数');d().querySelectorAll('.book-cover')[3].click();const text=d().querySelector('.book-page').textContent;click('下一章');assert(d().querySelector('.book-page').textContent!==text,'翻页无效');close();});
await test('12位邻居的工作入口与新增地图地点',async()=>{d().getElementById('together').click();click('邻居的委托');assert(d().querySelectorAll('.job-grid .recipe-card').length===12,'委托数量');close();d().getElementById('map-open').click();assert(d().getElementById('sheet-content').textContent.includes('豆灯咖啡摊'),'地图缺咖啡摊');close();});
for(const kind of WitchFestival.ids)await test(WitchFestival.CATALOG[kind][0]+' 在402与320宽度同屏',async()=>{hub(WitchFestival.CATALOG[kind][0]);d().querySelector('.festival-levels button').click();await wait(180);fits();if(kind==='mines'){d().querySelector('.festival-cell').click();assert(saved().playbox.mines.started,'首点无效');}if(kind==='ludo'){click('掷骰子');assert(saved().playbox.ludo.moves.length,'没有保存掷骰');}if(kind==='trail'){click('开始 / 继续');await wait(120);click('暂停');assert(saved().playbox.trail||d().querySelector('.f-trail'),'远足未初始化');}f.style.width='320px';f.style.height='568px';await wait(120);fits();close();f.style.width='402px';f.style.height='874px';});
await test('2048上下左右呈十字排列',async()=>{hub('星砂合成');click('新的一盘');await wait(150);const r=q=>d().querySelector('.direction-pad [data-dir="'+q+'"]').getBoundingClientRect(),u=r('U'),left=r('L'),down=r('D'),right=r('R');assert(u.y<down.y&&left.x<down.x&&down.x<right.x,'方向键位置错误');fits();close();});
await test('36块新拼图同屏并保留交换结果',async()=>{hub('拼一张小世界');const groups=d().querySelectorAll('.card');const button=[...d().querySelectorAll('button')].find(b=>b.textContent==='36 块');assert(button,'缺36块档');button.click();await wait(150);assert(d().querySelectorAll('.puzzle-piece').length===36,'拼图块数');fits();d().querySelectorAll('.puzzle-piece')[0].click();d().querySelectorAll('.puzzle-piece')[1].click();assert(saved().playbox.puzzle.moves===1,'拼图交换未保存');close();});
await test('桌面布局和完整存档校验',async()=>{f.style.width='1280px';f.style.height='800px';hub('露珠扫雷');click('继续上次的游戏');await wait(150);fits();close();WitchLife.validate(saved(),Date.now());assert(!f.contentWindow.__testErrors.length,f.contentWindow.__testErrors.join(';'));});
}catch(e){results.push({name:'启动',pass:false,error:e.message})}finally{const errors=f?.contentWindow?.__testErrors||[];f?.remove();await wait(100);for(const[k,v]of backup)v===null?localStorage.removeItem(k):localStorage.setItem(k,v);document.getElementById('result').textContent=results.filter(x=>x.pass).length+'/'+results.length+' passed';const pre=document.createElement('pre');pre.id='test-json';pre.textContent=JSON.stringify({results,errors},null,2);document.body.append(pre)}})();
</script></html>
