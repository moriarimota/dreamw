<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>梦乡 v6 地图与旧功能集成检查</title><style>body{font:14px/1.65 system-ui;color:#354535;background:#f5ecd9;margin:20px}iframe{border:1px solid #947f58;width:390px;height:844px}.fail{color:#a33}</style><h1>梦乡 v6 集成检查</h1><p id="result">准备隔离世界……</p><ol id="checks"></ol><div id="fixture"></div>
<script src="../game/arcade-plus.js"></script><script src="../game/arcade.js"></script><script src="../game/board-games.js"></script><script src="../game/seasons.js"></script><script src="../game/country.js"></script><script src="../game/companions.js"></script><script src="../game/letters.js"></script><script src="../game/hobbies.js"></script><script src="../game/festival-games.js"></script><script src="../game/games.js"></script><script src="../game/village.js"></script><script src="../game/kitchen.js"></script><script src="../game/library.js"></script><script src="../game/life.js"></script><script>
(async()=>{'use strict';const keys=['witchlife-world-v2','witchlife-world-v2-previous','witchlife-world-v2-before-v6','witchlife-world-v2-before-v7'],backup=new Map(keys.map(k=>[k,localStorage.getItem(k)])),checks=[],errors=[];let frame;const L=WitchLife,V=WitchVillage,wait=ms=>new Promise(r=>setTimeout(r,ms)),d=()=>frame.contentDocument,saved=()=>JSON.parse(localStorage.getItem(keys[0]));function assert(v,m){if(!v)throw Error(m);}async function until(fn,ms=25000){const end=Date.now()+ms;while(Date.now()<end){if(fn())return;await wait(70);}throw Error('等待超时');}function click(t){const b=[...d().querySelectorAll('button')].find(b=>b.textContent.trim()===t&&!b.closest('[hidden]'));assert(b,'按钮缺失 '+t);assert(!b.disabled,'按钮被禁用 '+t);b.click();}function close(){d().getElementById('close-sheet').click();}async function test(name,fn){try{await fn();checks.push({name,pass:true});}catch(e){checks.push({name,pass:false,error:e.message});}const row=document.createElement('li'),last=checks.at(-1);row.className=last.pass?'':'fail';row.textContent=(last.pass?'PASS ':'FAIL ')+name+(last.error?' · '+last.error:'');document.getElementById('checks').append(row);document.getElementById('result').textContent=checks.length+' 项已完成';}async function loaded(){await until(()=>d()?.querySelector('#village-world[data-ready=true]')&&d().getElementById('loading').hidden);frame.contentWindow.addEventListener('error',e=>errors.push(e.message));}
try{const s=L.create(Date.now());s.version=5;delete s.village;s.avatar.kind='original';s.preferences.name='测试伙伴';s.country.rod=1;localStorage.setItem(keys[0],JSON.stringify(s));frame=document.createElement('iframe');frame.src='../game/index.html?v6-ui';frame.title='隔离验证用世界';document.getElementById('fixture').append(frame);await loaded();
await test('旧档启动为梦乡，原角色与阅读保留，新增地图',async()=>{assert(d().title.includes('梦乡'),'标题');assert(saved().version===6,'版本');assert(saved().avatar.kind==='original','原角色');assert(saved().activity.kind==='read','阅读');assert(saved().village.location.area==='inside','室内');assert(d().querySelector('#village-world canvas'),'地图画布');});
await test('手机和宽屏使用实际窗口大小，无横向溢出',async()=>{assert(d().documentElement.scrollWidth===390,'手机溢出');frame.style.width='1100px';frame.style.height='760px';await wait(350);assert(d().querySelector('#cottage').getBoundingClientRect().width===1100,'仍是固定手机画幅');assert(d().documentElement.scrollWidth===1100,'桌面溢出');frame.style.width='390px';frame.style.height='844px';await wait(350);});
await test('全景、跟随、远近、音效按钮可操作',async()=>{click('全景');assert(d().getElementById('map-overview').getAttribute('aria-pressed')==='true','全景');click('跟着她');click('远近');click('音效关');assert(saved().village.sound===true,'音效保存');click('音效开');});
await test('从屋内出发去河畔，中途未开始耕作，刷新能接上路线',async()=>{click('地图');click('河畔小田街区与河畔');await wait(2200);assert(saved().village.journey,'真实路程');assert(d().getElementById('sheet').hidden,'途中不应开种田面板');assert(d().getElementById('status').textContent.includes('前往'),'路程状态');const before=saved().village.journey.endsAt;frame.src='../game/index.html?v6-ui-reload';await loaded();assert(saved().village.journey.endsAt===before,'刷新重置路程');await until(()=>d().getElementById('village-world').dataset.area==='village'&&d().getElementById('village-world').dataset.moving==='false');assert(Math.abs(+d().getElementById('village-world').dataset.x-V.SPOTS.farm.x)<2,'没有到达田边');});
await test('到田边再打开面板，种子与实际地块一致',async()=>{click('地图');click('河畔小田街区与河畔');await until(()=>!d().getElementById('sheet').hidden&&d().getElementById('sheet-title').textContent.includes('六块小田'));click('种下');assert(saved().country.plots[0].crop==='radish','未种下');assert(saved().country.seeds.radish===2,'种子消耗');assert(d().querySelector('.farm-plot progress'),'显示生长');close();});
await test('在同一个世界邀请下棋、收棋后继续生活',async()=>{click('一起待会儿');click('玩会儿游戏');assert(d().querySelectorAll('.game-choice').length===8,'小游戏丢失');click('五子棋轮流落子，和伙伴下一盘。');await wait(150);assert(saved().activity.kind==='game','未暂停日常');close();assert(saved().activity.kind!=='game','未恢复日常');});
await test('数独仍能生成、输入、收好并续局',async()=>{click('一起待会儿');click('玩会儿游戏');click('伙伴的数独轻松题或标准题，带笔记和提示。');click('轻松题');assert(d().querySelectorAll('.sudoku-cell').length===81,'题纸丢失');const id=saved().playbox.sudoku.id;close();click('一起待会儿');click('玩会儿游戏');click('伙伴的数独轻松题或标准题，带笔记和提示。');assert(saved().playbox.sudoku.id===id,'未续局');assert(d().documentElement.scrollWidth===390,'题纸溢出');close();});
await test('梦种输入正常，键盘方向控制不吞掉文字',async()=>{click('留颗梦种');const input=d().querySelector('#fragment-input');input.value='测试片段：花园里有一颗会发光的种子 WASD';input.dispatchEvent(new Event('input',{bubbles:true}));click('把梦种交给她');assert(saved().fragments.at(-1).text.endsWith('WASD'),'输入丢失');close();});
await test('沿路找到居民，可以相识、借书并保存关系',async()=>{click('地图');click('去找苔米');await until(()=>!d().getElementById('sheet').hidden&&d().getElementById('sheet-title').textContent.includes('苔米'),30000);click('打个招呼，认识一下');assert(saved().village.contacts.moss.met,'未认识');click('借一本植物观察的书');assert(saved().village.contacts.moss.borrowed,'未借书');assert(saved().memories.some(m=>m.key==='neighbor:borrow'),'没有借书记忆');close();});
await test('新地图真实交互未产生脚本错误',async()=>assert(errors.length===0,errors.join(';')));
}catch(e){checks.push({name:'启动或测试流程',pass:false,error:e.message});}finally{if(frame)frame.remove();await wait(100);for(const[k,v]of backup)v===null?localStorage.removeItem(k):localStorage.setItem(k,v);document.getElementById('result').textContent=checks.filter(c=>c.pass).length+'/'+checks.length+' passed';const output=document.createElement('pre');output.id='test-json';output.textContent=JSON.stringify({checks,errors},null,2);document.body.append(output);window.__v6Results=checks;}})();
</script></html>
