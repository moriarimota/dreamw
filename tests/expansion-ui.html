<!doctype html><meta charset="utf-8"><title>小院与游戏桌验证</title><style>body{font:15px/1.7 system-ui;background:#f8efdb;color:#344d36;padding:20px}iframe{width:390px;height:844px;border:1px solid #bc9e68}li{margin:10px 0}.fail{color:#a22}pre{white-space:pre-wrap}</style><h1>小院与游戏桌验证</h1><p id="result">验证中…</p><ol id="checks"></ol><div id="fixture"></div><script src="../game/games.js?v=0.3.0"></script><script src="../game/life.js?v=0.3.0"></script><script>
(async()=>{
const keys=['witchlife-world-v2','witchlife-world-v2-previous','witchlife-world-v2-before-v3'],backups=new Map(),results=[],errors=[];let f;const wait=ms=>new Promise(r=>setTimeout(r,ms));const assert=(x,m)=>{if(!x)throw Error(m);};const doc=()=>f.contentDocument,saved=()=>JSON.parse(localStorage.getItem(keys[0]));
const click=t=>{const b=[...doc().querySelectorAll('#sheet-content button')].find(b=>b.textContent.trim()===t);assert(b,'按钮不存在：'+t);b.click();};
async function until(fn){for(let i=0;i<200;i++){if(fn())return;await wait(50);}throw Error('等待超时');}
async function test(name,fn){await fn();results.push({name,pass:true});}
async function unload(){if(!f)return;const old=f;await new Promise(r=>{old.onload=r;old.src='about:blank';setTimeout(r,1000);});old.remove();f=null;}
async function launch(s){await unload();if(s)localStorage.setItem(keys[0],JSON.stringify(s));f=document.createElement('iframe');f.title='扩充版隔离游戏';f.src='../game/index.html?expansion='+Date.now();document.getElementById('fixture').append(f);await new Promise(r=>f.onload=r);f.contentWindow.addEventListener('error',e=>errors.push(e.message));f.contentWindow.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));await until(()=>doc().getElementById('loading').hidden);}
const close=()=>doc().getElementById('close-sheet').click();const hub=()=>{doc().getElementById('together').click();click('玩会儿游戏');};const choice=t=>{const b=[...doc().querySelectorAll('.game-choice')].find(b=>b.querySelector('strong').textContent===t);assert(b,'缺少游戏');b.click();};
try{
assert(location.hostname==='127.0.0.1'&&location.port==='18766','仅测试源可运行');keys.forEach(k=>backups.set(k,localStorage.getItem(k)));const old=WitchLife.create(Date.now());old.version=2;delete old.home;delete old.playbox;delete old.preferences.utcOffsetMinutes;
await test('真实页面从 v2 迁移，保留原始备份与同一本书',async()=>{await launch(old);assert(saved().version===3,'没有迁移');assert(saved().activity.bookId===old.activity.bookId,'书丢失');assert(JSON.parse(localStorage.getItem(keys[2])).version===2,'缺少旧档备份');});
await test('设备时钟和游戏天气说明可见',async()=>{assert(/\d{2}:\d{2}/.test(doc().getElementById('real-clock').textContent),'时钟缺失');doc().getElementById('weather').click();assert(doc().getElementById('sheet-content').textContent.includes('不代表你所在城市的实况'),'天气来源不清楚');close();});
await test('小院图片与热点可进入，不会把正在读书的她瞬移出来',async()=>{doc().getElementById('room-courtyard').click();await until(()=>doc().querySelector('.room').complete&&doc().querySelector('.room').naturalWidth);assert(doc().querySelector('.room').src.includes('courtyard'),'没有小院');await wait(100);assert(doc().getElementById('witch-hit').hidden,'人在错误场景');assert(doc().querySelectorAll('#scene-hits button').length===5,'场景热点缺失');doc().querySelector('[aria-label="鸟饮水盆"]').click();click('给饮水盆添水');assert(saved().home.birdWater===3,'添水没有影响状态');doc().getElementById('follow').click();});
await test('游戏桌有四种选择，数独可填数字并恢复未完题',async()=>{hub();assert(doc().querySelectorAll('.game-choice').length===4,'少了游戏');choice('小罗的数独');click('轻松题');const b=saved().playbox.sudoku;assert(b&&doc().querySelectorAll('.sudoku-cell').length===81,'题纸没打开');const i=b.givens.findIndex(v=>!v);doc().querySelectorAll('.sudoku-cell')[i].click();click('给一点提示');const filled=saved().playbox.sudoku.values[i];assert(filled,'提示未填入');const id=b.id;close();assert(saved().activity.kind==='read','未回到书页');hub();choice('小罗的数独');assert(saved().playbox.sudoku.id===id&&saved().playbox.sudoku.values[i]===filled,'题纸未续上');});
await test('解完数独记录一次共同经历，重开不重复记录',async()=>{for(let i=0;i<81&&!doc().querySelector('.game-message').textContent.includes('解出来');i++)click('给一点提示');assert(doc().querySelector('.game-message').textContent.includes('解出来'),'没有完成反馈');const key=saved().playbox.sudoku.id;assert(saved().memories.filter(m=>m.key===key).length===1,'没有完成记忆');close();hub();choice('小罗的数独');assert(saved().memories.filter(m=>m.key===key).length===1,'重复奖励');close();});
await test('小院拼图实际加载图像，交换能完成并保存',async()=>{hub();choice('拼一张小世界');click('拼小院 · 9 块');await wait(700);for(let i=0;i<9;i++){const p=saved().playbox.puzzle;if(p.tiles[i]!==i){doc().querySelectorAll('.puzzle-piece')[i].click();doc().querySelectorAll('.puzzle-piece')[p.tiles.indexOf(i)].click();}}assert(doc().querySelector('.game-message').textContent.includes('位置了'),'拼图没有完成');assert(saved().playbox.puzzle.moves>0,'交换未保存');close();});
await test('翻开两张后收起会停计时，续局再正确结算',async()=>{hub();choice('星月记忆牌');const c=saved().playbox.pairs;const a=0,b=c.deck.findIndex(v=>v===c.deck[a]&&v!==undefined&&c.deck.indexOf(v)!==0);const second=c.deck.findIndex((v,i)=>i!==0&&v===c.deck[0]);doc().querySelectorAll('.pair-card')[0].click();doc().querySelectorAll('.pair-card')[second].click();close();await wait(1000);assert(saved().playbox.pairs.open.length===2&&saved().playbox.pairs.matched.length===0,'收起后计时仍运行');hub();choice('星月记忆牌');await until(()=>saved().playbox.pairs.matched.length===2);});
await test('记忆牌可找齐全部六对，结束后回到生活',async()=>{for(let v=0;v<6;v++){const c=saved().playbox.pairs,pos=c.deck.flatMap((n,i)=>n===v?[i]:[]);if(c.matched.includes(pos[0]))continue;doc().querySelectorAll('.pair-card')[pos[0]].click();doc().querySelectorAll('.pair-card')[pos[1]].click();await until(()=>saved().playbox.pairs.open.length===0);}assert(doc().querySelector('.game-message').textContent.includes('找齐'),'翻牌未完成');close();assert(saved().activity.kind==='read','没接回生活');});
await test('家具交互的摆放、灯光与场景一致',async()=>{doc().querySelector('[aria-label="收藏架"]').click();click('把收藏挪到窗边');assert(saved().home.displayMode==='window','摆放没保存');doc().querySelector('[aria-label="收藏架"]').click();click('把小灯调暗');assert(saved().home.lamp===false,'灯光没保存');});
await test('小游戏与场景切换没有运行错误',async()=>assert(errors.length===0,errors.join('\n')));
}catch(e){results.push({name:'扩充集成流程',pass:false,error:e.stack});}finally{await unload();backups.forEach((v,k)=>v===null?localStorage.removeItem(k):localStorage.setItem(k,v));for(const r of results){const li=document.createElement('li');li.textContent=(r.pass?'✓ ':'✗ ')+r.name;if(!r.pass){li.className='fail';const pre=document.createElement('pre');pre.textContent=r.error;li.append(pre);}document.getElementById('checks').append(li);}document.getElementById('result').textContent=results.filter(r=>r.pass).length+' / '+results.length+' 项通过，测试存档已恢复';document.documentElement.dataset.testResult=results.every(r=>r.pass)?'pass':'fail';}
})();
</script>
