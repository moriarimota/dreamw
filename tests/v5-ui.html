<script src="../game/arcade-plus.js?v=0.5.0"></script><script src="../game/arcade.js?v=0.5.0"></script><script src="../game/board-games.js?v=0.5.0"></script><script src="../game/country.js?v=0.5.0"></script><script src="../game/companions.js?v=0.5.0"></script><script src="../game/hobbies.js?v=0.5.0"></script><script src="../game/games.js?v=0.5.0"></script><script src="../game/life.js?v=0.5.0"></script><script>
(async()=>{'use strict';const L=WitchLife,A=WitchArcade,keys=['witchlife-world-v2','witchlife-world-v2-previous','witchlife-world-v2-before-v5'],backups=new Map(),results=[],errors=[];let frame;const wait=ms=>new Promise(r=>setTimeout(r,ms)),assert=(v,t)=>{if(!v)throw Error(t);},doc=()=>frame.contentDocument,saved=()=>JSON.parse(localStorage.getItem(keys[0]));
async function until(fn){for(let i=0;i<240;i++){if(fn())return;await wait(50);}throw Error('等待超时');}function click(text){const b=[...doc().querySelectorAll('#sheet-content button')].find(b=>b.textContent.trim()===text);assert(b,'找不到按钮 '+text);assert(!b.disabled,'按钮不可用 '+text);b.click();}function select(label,value){const s=doc().querySelector('select[aria-label="'+label+'"]');assert(s,'找不到选择器 '+label);s.value=value;s.dispatchEvent(new Event('change'));}const close=()=>doc().getElementById('close-sheet').click(),hub=()=>{doc().getElementById('together').click();click('玩会儿游戏');},choice=name=>{const b=[...doc().querySelectorAll('.game-choice')].find(b=>b.querySelector('strong').textContent===name);assert(b,'没有游戏 '+name);b.click();},byPrefix=t=>{const b=[...doc().querySelectorAll('#sheet-content button')].find(b=>b.textContent.startsWith(t));assert(b,'没有按钮 '+t);b.click();};
async function unload(){if(!frame)return;const old=frame;await new Promise(r=>{old.onload=r;old.src='about:blank';setTimeout(r,1000);});old.remove();frame=null;}
async function launch(s){await unload();if(s)localStorage.setItem(keys[0],JSON.stringify(s));else localStorage.removeItem(keys[0]);frame=document.createElement('iframe');frame.title='320像素宽隔离试玩';frame.src='../game/index.html?v5test='+Date.now();document.getElementById('fixture').append(frame);await new Promise(r=>frame.onload=r);frame.contentWindow.addEventListener('error',e=>errors.push(e.message));frame.contentWindow.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));await until(()=>doc().getElementById('loading').hidden);}
async function test(name,fn){await fn();results.push(true);const li=document.createElement('li');li.textContent='✓ '+name;document.getElementById('checks').append(li);}
try{assert(location.hostname==='127.0.0.1'&&location.port==='18766','只允许隔离测试源');keys.forEach(k=>backups.set(k,localStorage.getItem(k)));localStorage.removeItem(keys[2]);
await test('新浏览器进入角色创建，独立名字、配色、性格',async()=>{await launch();assert(doc().getElementById('sheet-title').textContent==='属于你的魔法伙伴','未进入创建');assert(saved().preferences.name!=='小罗','复制了用户OC');const form=doc().querySelector('.profile-form');form.querySelector('input').value='测试苔苔';form.querySelector('select').value='fox';form.querySelector('select').dispatchEvent(new Event('change'));form.querySelector('input[type=range]').value=10;click('让伙伴住进来');assert(saved().avatar.form==='fox','外形未保存');assert(saved().preferences.name==='测试苔苔','名字未保存');assert(saved().preferences.curiosity===.1,'性格未保存');});
await test('AI角色JSON只填受支持字段，实际图片上传压缩入档',async()=>{doc().getElementById('settings').click();click('伙伴的名字、外形与性格');doc().querySelector('details').open=true;doc().querySelector('[aria-label="导入角色 JSON"]').value=JSON.stringify({name:'测试月蛾',form:'moth',body:'#aabbcc',accent:'#ffeedd',personality:{quiet:.9,bookish:.2,curiosity:.6},coins:999999});click('检查并填入设定');const canvas=document.createElement('canvas');canvas.width=canvas.height=640;canvas.getContext('2d').fillRect(0,0,320,320);const blob=await new Promise(r=>canvas.toBlob(r));const file=new File([blob],'fixture.png',{type:'image/png'}),dt=new DataTransfer();dt.items.add(file);const input=doc().querySelector('.profile-form input[type=file]');input.files=dt.files;input.dispatchEvent(new Event('change'));await until(()=>doc().querySelector('.profile-form .game-message').textContent.includes('图片准备好了'));click('让伙伴住进来');assert(saved().avatar.kind==='portrait'&&saved().avatar.portrait.startsWith('data:image/png'),'图片未入档');assert(saved().country.coins===30,'AI输入越过白名单');await launch(saved());assert(doc().getElementById('sheet').hidden,'重启重复创建');assert(saved().preferences.name==='测试月蛾','重启丢失角色');});
await test('旧v4原档迁移仍是小罗，保留备份且不出现创建页',async()=>{const s=L.create(Date.now());s.version=4;s.preferences.name='小罗';L.addFragment(s,'测试用的河边石头',Date.now());delete s.avatar;delete s.country;delete s.learning;await launch(s);assert(saved().avatar.kind==='original','没有保留小罗');assert(saved().preferences.name==='小罗','旧名丢失');assert(doc().getElementById('sheet').hidden,'老玩家出现创建页');assert(JSON.parse(localStorage.getItem(keys[2])).version===4,'缺旧备份');assert(saved().fragments.length===1,'旧梦种丢失');});
await test('河畔画面加载，种植浇水、田地说明和手机布局',async()=>{doc().getElementById('room-riverbank').click();await until(()=>doc().querySelector('.room').complete&&doc().querySelector('.room').src.includes('riverbank'));doc().querySelector('[aria-label="六块小田"]').click();assert(doc().querySelectorAll('.farm-plot').length===6,'不是六块田');doc().querySelector('.farm-plot button').click();assert(saved().country.plots[0].crop==='radish','种植无效');doc().querySelector('.farm-plot button').click();assert(saved().country.plots[0].waterUntil>Date.now(),'浇水无效');assert(doc().documentElement.scrollWidth<=320,'田地溢出');});
await test('商店购买真实扣钱，钓鱼成功入篓，离开可续竿',async()=>{click('河畔小店');click('木鱼竿 · 12 星砂');assert(saved().country.coins===18&&saved().country.rod===1,'购买没结算');click('木栈桥');click('抛一竿 · 用 1 鱼饵');assert(saved().country.bait===4,'扣饵错误');await wait(3300);for(let n=0;n<24&&['waiting','hooked'].includes(saved().country.session.stage);n++)click(saved().country.session.tension>65?'松线':'收线');assert(saved().country.session.stage==='caught','未能钓到鱼');assert(Object.values(saved().country.fish).reduce((a,b)=>a+b,0)===1,'重复或未入篓');click('抛一竿 · 用 1 鱼饵');const id=saved().country.session.id;click('先收好，下次继续');doc().getElementById('room-riverbank').click();doc().querySelector('[aria-label="木栈桥"]').click();assert(saved().country.session.id===id&&saved().country.bait===3,'续竿又扣饵');close();});
await test('成熟田地可收获并在商店卖出，经济闭环',async()=>{const s=saved();s.country.plots[0].workMs=294000;await launch(s);doc().getElementById('room-riverbank').click();doc().querySelector('[aria-label="六块小田"]').click();await until(()=>[...doc().querySelectorAll('.farm-plot button')].some(b=>b.textContent==='收获'));click('收获');assert(saved().country.bag.radish===3,'未入仓');click('河畔小店');byPrefix('小萝卜 ×3');assert(saved().country.bag.radish===2&&saved().country.coins===21,'出售错误');close();});
await test('八种游戏入口，挑战棋盘96格且可选四角移动',async()=>{hub();assert(doc().querySelectorAll('.game-choice').length===8,'游戏数不符');choice('星月连连看');select('难度','expert');select('棋盘怎样移动','out');doc().querySelector('.level-button').click();assert(saved().playbox.link.mode==='expert'&&saved().playbox.link.flow==='out','模式没生效');assert(doc().querySelectorAll('.arcade-tile').length===96,'棋盘不够大');const h=A.linkHint(saved().playbox.link);doc().querySelectorAll('.arcade-tile')[h.a].click();doc().querySelectorAll('.arcade-tile')[h.b].click();assert(saved().playbox.link.moves===1,'没有消除');click('伙伴给点提示');assert(saved().playbox.link.helps===1,'提示次数错误');click('放大棋盘');assert(doc().querySelector('.arcade-wrap.zoomed'),'不能放大');assert(doc().documentElement.scrollWidth<=320,'页面横向溢出');close();});
await test('连连看未完关卡切换需要确认，重玩保持当前模式',async()=>{hub();choice('星月连连看');select('难度','hard');select('棋盘怎样移动','in');doc().querySelectorAll('.level-button')[8].click();assert(saved().playbox.link.mode==='expert','没确认就替换');click('开始所选关卡');assert(saved().playbox.link.mode==='hard'&&saved().playbox.link.level===9,'未切换');click('重玩这一关');click('确定');assert(saved().playbox.link.mode==='hard'&&saved().playbox.link.flow==='in','重玩变了模式');close();});
await test('融霜与潮汐的棋盘反馈、合法交换及稳定保存',async()=>{hub();choice('小院消消乐');select('玩法','garden');doc().querySelector('.level-button').click();assert(doc().querySelectorAll('.frozen').length===9,'冰霜未显示');let h=A.matchHint(saved().playbox.match3);doc().querySelectorAll('.arcade-tile')[h.a].click();doc().querySelectorAll('.arcade-tile')[h.b].click();await wait(300);assert(saved().playbox.match3.turns===1,'交换未生效');click('柔和配色');assert(doc().querySelector('.quiet-colors'),'护眼配色未生效');click('关卡册');select('玩法','tide');doc().querySelectorAll('.level-button')[1].click();click('开始所选关卡');assert(saved().playbox.match3.mode==='tide','潮汐模式未开始');close();});
await test('六页围棋教学实际交互，进度保存',async()=>{hub();choice('一起学围棋');byPrefix('围棋教学');const cells=()=>doc().querySelectorAll('.go-cell');cells()[12].click();click('下一页');for(const i of [7,11,13,17])cells()[i].click();click('下一页');cells()[13].click();click('下一页');cells()[12].click();assert(doc().querySelector('.game-message').textContent.includes('没有气'),'自杀提示缺失');click('下一页');click('下一页');click('开始提子练习');assert(saved().learning.go===6,'教学没保存');assert(saved().playbox.go.mode==='capture','未开始提子棋');});
await test('围棋陪练自动应手、悔棋、续局和九路同屏点目',async()=>{doc().querySelectorAll('.go-cell')[12].click();await wait(450);assert(saved().playbox.go.moves.length===2,'伙伴未应手');click('悔棋');assert(saved().playbox.go.moves.length===0,'悔棋未回一回合');close();hub();choice('一起学围棋');click('继续上次的棋盘');assert(saved().playbox.go.moves.length===0,'未续局');click('换一种练习');const buttons=[...doc().querySelectorAll('button')].filter(b=>b.textContent==='同屏两个人下');buttons[1].click();click('确认开新盘');assert(doc().querySelectorAll('.go-cell').length===81,'非九路');doc().querySelectorAll('.go-cell')[40].click();doc().querySelectorAll('.go-cell')[0].click();click('停一手');click('停一手');assert(saved().playbox.go.scoring,'未进入点目');click('确认点目');assert(saved().playbox.go.winner,'未收棋');close();});
await test('象棋能选择棋子与合法落点，伙伴应手且棋局可恢复',async()=>{hub();choice('一起学象棋');click('和伙伴练习');assert(doc().querySelectorAll('.xq-cell').length===90,'棋盘尺寸不正确');doc().querySelectorAll('.xq-cell')[82].click();assert(doc().querySelectorAll('.legal-target').length===2,'马落点不对');doc().querySelectorAll('.xq-cell')[65].click();await wait(500);assert(saved().playbox.xiangqi.moves.length===2,'象棋陪练未应手');const id=saved().playbox.xiangqi.id;close();hub();choice('一起学象棋');click('继续上次的棋盘');assert(saved().playbox.xiangqi.id===id&&saved().playbox.xiangqi.moves.length===2,'未续棋');assert(doc().documentElement.scrollWidth<=320,'象棋溢出');close();});
await test('全流程无脚本错误，原有手作和梦种仍可打开',async()=>{doc().getElementById('together').click();click('她的兴趣手册');assert(doc().querySelectorAll('.hobby-card').length===6,'原兴趣缺失');close();doc().getElementById('collection').click();assert(saved().fragments.length===1,'梦种丢失');assert(errors.length===0,errors.join('\n'));});
}catch(e){results.push(false);const li=document.createElement('li');li.className='fail';li.textContent='✗ '+e.stack;document.getElementById('checks').append(li);}finally{await unload();backups.forEach((v,k)=>v===null?localStorage.removeItem(k):localStorage.setItem(k,v));document.getElementById('result').textContent=results.filter(Boolean).length+' / '+results.length+' 项通过；隔离存档已还原。';document.documentElement.dataset.testResult=results.every(Boolean)?'pass':'fail';}})();
