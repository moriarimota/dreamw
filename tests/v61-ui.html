<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>梦乡 v0.6.1 交互回归</title><style>body{font:14px/1.6 system-ui;background:#eee8d8;color:#304938}iframe{border:0;width:390px;height:844px}.fail{color:#b33}</style><h1>界面与动画检查</h1><p id="result">测试中</p><ol id="checks"></ol><div id="fixture"></div>
<script src="../game/arcade-plus.js"></script><script src="../game/arcade.js"></script><script src="../game/board-games.js"></script><script src="../game/country.js"></script><script src="../game/companions.js"></script><script src="../game/hobbies.js"></script><script src="../game/games.js"></script><script src="../game/village.js"></script><script src="../game/life.js"></script><script>
(async()=>{const keys=['witchlife-world-v2','witchlife-world-v2-previous','witchlife-world-v2-before-v6'],backup=new Map(keys.map(k=>[k,localStorage.getItem(k)])),results=[],errors=[];let f;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),d=()=>f.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},until=async fn=>{for(let i=0;i<400;i++){if(fn())return;await wait(50)}throw Error('等待超时')};
function button(text){const b=[...d().querySelectorAll('button')].find(b=>b.textContent.trim()===text&&!b.closest('[hidden]'));assert(b,'缺少按钮 '+text);return b}function click(t){button(t).click()}function close(){d().getElementById('close-sheet').click()}function hub(name){d().getElementById('together').click();click('玩会儿游戏');[...d().querySelectorAll('.game-choice')].find(x=>x.querySelector('strong').textContent===name).click()}
function fits(){const b=d().querySelector('.play-main .arcade-wrap,.play-main .sudoku-board,.play-main .wg-board,.play-main .go-grid,.play-main .xq-grid,.play-main .pairs-board,.play-main .puzzle-board');assert(b,'棋盘不存在');const r=b.getBoundingClientRect(),sheet=d().getElementById('sheet'),h=f.clientHeight;assert(r.top>=0&&r.bottom<=h+1,'棋盘被裁切 '+JSON.stringify(r));assert(sheet.scrollHeight<=sheet.clientHeight+1,'需要滚动整个游戏面板');const side=d().querySelector('.play-tools').getBoundingClientRect();assert(side.bottom<=h+1,'操作区出屏');assert(d().documentElement.scrollWidth<=f.clientWidth,'横向溢出');}
async function test(name,fn){try{await fn();results.push({name,pass:true})}catch(e){results.push({name,pass:false,error:e.message})}const x=results.at(-1),li=document.createElement('li');li.textContent=(x.pass?'PASS ':'FAIL ')+name+(x.error?' '+x.error:'');li.className=x.pass?'':'fail';document.getElementById('checks').append(li)}
try{assert(location.port==='18766','仅限隔离测试源');const s=WitchLife.create(Date.now());s.avatar.kind='original';s.country.rod=1;localStorage.setItem(keys[0],JSON.stringify(s));f=document.createElement('iframe');f.src='../game/index.html?v61-test';document.getElementById('fixture').append(f);await until(()=>d()?.querySelector('#village-world[data-ready=true]'));f.contentWindow.addEventListener('error',e=>errors.push(e.message));
await test('标题紧凑，移动时不显示工作倒计时',async()=>{assert(d().querySelector('.header').getBoundingClientRect().height<=42,'标题仍过大');d().getElementById('map-open').click();click('河畔小田沿街走走');await wait(300);assert(d().querySelector('.progress-track').hidden,'走路仍有进度条');});
await test('五子棋在手机与桌面完整显示',async()=>{hub('五子棋');await wait(250);fits();f.style.width='1280px';f.style.height='800px';await wait(250);fits();close();f.style.width='390px';f.style.height='844px';});
await test('数独题纸与数字键同屏，320宽度可用',async()=>{hub('伙伴的数独');click('轻松题');await wait(250);fits();f.style.width='320px';f.style.height='568px';await wait(250);fits();close();f.style.width='390px';f.style.height='844px';});
await test('连连看挑战模式自动适配，无柔和配色开关',async()=>{hub('星月连连看');const mode=d().querySelector('select[aria-label="难度"]');mode.value='expert';mode.dispatchEvent(new Event('change'));d().querySelector('.level-button').click();await wait(250);assert(d().querySelectorAll('.arcade-tile').length===96,'挑战格数');fits();assert(![...d().querySelectorAll('button')].some(b=>b.textContent==='柔和配色'),'旧按钮');f.style.width='1280px';f.style.height='800px';await wait(250);fits();close();});
await test('消消乐无固定大空白与页面滚动',async()=>{hub('小院消消乐');d().querySelector('.level-button').click();await wait(250);fits();close();});
await test('无脚本错误，存档仍可校验',async()=>{assert(!errors.length,errors.join(';'));WitchLife.validate(JSON.parse(localStorage.getItem(keys[0])),Date.now());});
}catch(e){results.push({name:'启动',pass:false,error:e.message})}finally{f?.remove();await wait(100);for(const[k,v]of backup)v===null?localStorage.removeItem(k):localStorage.setItem(k,v);document.getElementById('result').textContent=results.filter(x=>x.pass).length+'/'+results.length+' passed';const pre=document.createElement('pre');pre.id='test-json';pre.textContent=JSON.stringify({results,errors},null,2);document.body.append(pre)}})();
</script></html>
